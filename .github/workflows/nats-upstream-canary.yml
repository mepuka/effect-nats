name: NATS upstream canary

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # NATS releases are infrequent; a daily run keeps detection latency below 24 hours.
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nats-upstream-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest:
    name: Latest stable NATS.js and nats-server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install latest stable native nats-server
        uses: aricart/install-binary@ea21a65da24c871c1cb40b1e0b6e3b3db8252f2b # v2.0.0
        with:
          repo: nats-io/nats-server
          tag: latest
          name: nats-server

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Move declared NATS.js packages to the latest npm release
        run: |
          bun update --latest @nats-io/jetstream @nats-io/nats-core @nats-io/transport-node
          bun update --latest --filter effect-nats-agents @nats-io/nats-core @nats-io/transport-node

      - name: Type-check against upstream latest
        run: bun run check

      - name: Test against upstream latest
        run: bun run test

      - name: Record upstream compatibility receipt
        if: always()
        shell: bash
        run: |
          {
            echo "## NATS upstream canary receipt"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Bun: \`$(bun --version)\`"
            echo "- nats-server: \`$(nats-server --version 2>&1 || echo unavailable)\`"
            echo
            echo "### Declared NATS.js packages"
            echo
            echo '```text'
            bun pm ls --all | grep '@nats-io/' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
