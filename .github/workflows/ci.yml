name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # This is a reproducible conformance pin, not a claimed support floor.
  NATS_SERVER_VERSION: v2.14.5

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install pinned native nats-server
        uses: aricart/install-binary@ea21a65da24c871c1cb40b1e0b6e3b3db8252f2b # v2.0.0
        with:
          repo: nats-io/nats-server
          tag: ${{ env.NATS_SERVER_VERSION }}
          name: nats-server
          cache: true

      - name: Record toolchain receipt
        run: |
          bun --version
          nats-server --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run check

      - name: Test
        run: bun run test
